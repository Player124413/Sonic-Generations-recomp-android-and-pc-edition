name: Windows (Sonic Generations)

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

env:
  BUILD_TYPE: Release

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 360
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up MSVC environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Ensure Clang 18+ and Ninja
        run: |
          $ok = $false
          $clang = Get-Command clang -ErrorAction SilentlyContinue
          if ($clang) {
            $ver = (& clang --version) | Select-Object -First 1
            Write-Host "found: $ver"
            if ($ver -match 'clang version (\d+)\.') { $ok = [int]$Matches[1] -ge 18 }
          }
          if (-not $ok) {
            Write-Host "installing LLVM via choco..."
            choco install llvm -y --no-progress
          }
          # Make clang-cl visible to the later steps however LLVM got here.
          "C:\Program Files\LLVM\bin" | Out-File -Append $env:GITHUB_PATH
          $env:Path = "C:\Program Files\LLVM\bin;$env:Path"
          Get-Command clang-cl -ErrorAction Stop | Out-Null
          & clang-cl --version | Select-Object -First 2
          & clang-cl --version | Select-Object -First 1 | ForEach-Object { Write-Output "::notice::clang-cl: $_" }
          if (-not (Get-Command ninja -ErrorAction SilentlyContinue)) {
            choco install ninja -y --no-progress
          }
          ninja --version
          cmake --version | Select-Object -First 1

      # SDK fetch is split into phases so a failure points at the phase
      # (the script also reports the failing command via ::error::).
      - name: Clone ReXGlue SDK
        shell: bash
        run: bash windows_sdk.sh windows/sdk/rexglue-sdk clone

      - name: Init SDK submodules
        shell: bash
        run: bash windows_sdk.sh windows/sdk/rexglue-sdk submodules

      - name: Apply SDK patches
        shell: bash
        run: bash windows_sdk.sh windows/sdk/rexglue-sdk patches

      - name: Configure (ClangCL + Ninja)
        run: >
          cmake -S windows -B build -G Ninja
          -DCMAKE_C_COMPILER=clang-cl -DCMAKE_CXX_COMPILER=clang-cl
          -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: |
          cmake --build build --parallel 2>&1 | Tee-Object -FilePath build/build.log
          if ($LASTEXITCODE -ne 0) {
            $log = Get-Content build/build.log
            function Out-Ann($level, $text) {
              $t = $text.Trim()
              if ($t.Length -gt 900) { $t = $t.Substring(0, 900) }
              Write-Output "::$level::$t"
            }
            Write-Output "::group::failures"
            # 1) failing outputs first (names the TU/target).
            $log | Select-String -Pattern "^FAILED" | ForEach-Object { $_.Line.Trim() } | Select-Object -Unique | Select-Object -First 8 | ForEach-Object { Out-Ann "error" $_ }
            # 2) diagnostic headers only (never `N |` snippet lines).
            $log | Where-Object { $_ -notmatch '^\s*\d+\s*\|' } | Select-String -Pattern "\(\d+(,\d+)?\)\s*:\s*(fatal\s+)?error|:\d+:\d+:\s*(fatal\s+)?error|error\s+(C|LNK)\d+|fatal error|ninja:\s*error|LINK\s*:.*error" | ForEach-Object { $_.Line.Trim() } | Select-Object -Unique | Select-Object -First 12 | ForEach-Object { Out-Ann "error" $_ }
            # 3) tail summary.
            $log | Select-Object -Last 4 | ForEach-Object { Out-Ann "notice" "tail: $_" }
            Write-Output "::endgroup::"
            exit 1
          }

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: windows-build-log
          path: build/build.log
          retention-days: 7

      - name: Package
        run: |
          cmake --install build --prefix dist
          Compress-Archive -Path dist/* -DestinationPath SonicGenerations-windows.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: SonicGenerations-windows
          path: SonicGenerations-windows.zip
          retention-days: 30

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: SonicGenerations-windows.zip
          generate_release_notes: true
